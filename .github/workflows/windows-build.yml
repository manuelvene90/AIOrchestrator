# The WPF app cannot be built where most of this repo is written.
#
# AIOrchestrator/ targets net10.0-windows with UseWPF, so `dotnet build` on macOS or Linux cannot
# even restore it — and on 2026-09-09 four files in it (the language checkbox, the settings section
# and their handlers) were edited blind for exactly that reason, with "a Windows build is still
# owed" written into the commit. This is that build, standing permanently instead of being owed.
#
# It builds ONLY the two things the other machines cannot: the WPF app, and the solution as a whole
# (which includes it). The suite runs here on both OSes because a suite that runs on one OS
# certifies one OS (2026-09-11: 42 red on the first Windows run).
name: windows-build

on:
  push:
    # `integration/**` was added by plan 01's gate (Task 14): the merge branch is where the two-OS
    # question is actually asked, and a trigger list that does not name it makes the gate unaskable
    # — the workflow is not on master either, so `workflow_dispatch` cannot reach it from here.
    branches: [ours/integration, 'integration/**', 'stage/**', master]
  pull_request:
  workflow_dispatch:

jobs:
  wpf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The app first, alone, so a failure names the project that cannot be built anywhere else.
      - name: Build the WPF app
        run: dotnet build AIOrchestrator/AIOrchestrator.csproj -c Debug -warnaserror:CS
      - name: Build the solution
        run: dotnet build AIOrchestrator.slnx -c Debug

  # The suite on both OSes. Until 2026-09-11 it had never run on Windows in CI and the first local
  # run there was 42 red; a suite that runs on one OS certifies one OS.
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install jq (Windows)
        if: runner.os == 'Windows'
        run: choco install jq -y --no-progress
      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      # THE SOLUTION IS NOT BUILDABLE ON LINUX and never was: `AIOrchestrator/` is `net10.0-windows`
      # with `UseWPF`, so `dotnet build AIOrchestrator.slnx` on ubuntu stops at NETSDK1100 ("set the
      # EnableWindowsTargeting property to true") in 20 seconds without compiling a single test. The
      # WPF job above is where that project is built, on the only OS that can run it; here the two
      # TEST projects are built directly, which pulls in CoreLib and FakeClaude and nothing else.
      # Windows still builds the whole solution, so nothing stops covering the daemon or the app.
      - name: Build (Windows — the whole solution)
        if: runner.os == 'Windows'
        run: dotnet build AIOrchestrator.slnx -c Debug
      - name: Build (Linux — the test projects, without the WPF app)
        if: runner.os == 'Linux'
        run: |
          dotnet build AIOrchestratorCoreLib.Tests/AIOrchestratorCoreLib.Tests.csproj -c Debug
          dotnet build tools/claude-contract/ClaudeContract.Tests/ClaudeContract.Tests.csproj -c Debug
          dotnet build AIOrchestrator.Daemon/AIOrchestrator.Daemon.csproj -c Debug
      - name: Test CoreLib
        run: dotnet test AIOrchestratorCoreLib.Tests/AIOrchestratorCoreLib.Tests.csproj --no-build -c Debug --logger "trx;LogFileName=corelib-${{ matrix.os }}.trx"
      - name: Test claude-contract
        run: dotnet test tools/claude-contract/ClaudeContract.Tests/ClaudeContract.Tests.csproj --no-build -c Debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
